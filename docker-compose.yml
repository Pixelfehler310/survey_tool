services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./surveys:/app/surveys
      - backend_data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://survey:survey@db:5432/survey_engine
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:3010
      - SURVEYS_PATH=/app/surveys
      - ADMIN_DASHBOARD_URL=http://localhost:3010/admin
      - FRONTEND_URL=http://localhost:3010
    command: sh -c "until nc -z db 5432; do echo 'Waiting for postgres...'; sleep 1;
      done && python -m alembic upgrade head && uvicorn app.main:app --host
      0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-exclude
      '*.db*'"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ../civic:/civic
    environment:
      - VITE_API_URL=http://localhost:8010
      - VITE_BACKEND_HOST=backend
      - VITE_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - VITE_USE_POLLING=false
    depends_on:
      - backend
    command: pnpm run dev -- --host 0.0.0.0 --port 3000

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: survey
      POSTGRES_PASSWORD: survey
      POSTGRES_DB: survey_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  backend_data:
