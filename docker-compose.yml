services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - ./surveys:/app/surveys
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/survey.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:3010
      - SURVEYS_PATH=/app/surveys
      - ADMIN_DASHBOARD_URL=http://localhost:3010/admin
      - FRONTEND_URL=http://localhost:3010
    command: sh -c "python -m alembic upgrade head && uvicorn app.main:app --host
      0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ../civic:/civic
    environment:
      - VITE_API_URL=http://localhost:8010
      - VITE_BACKEND_HOST=backend
      - VITE_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - VITE_USE_POLLING=false
    depends_on:
      - backend
    command: pnpm run dev -- --host 0.0.0.0 --port 3000
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
